<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Daehan Yoon — Pusan National University</title>
  <desc id="desc">A midnight blue banner with teal and lavender orbital lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c34"/>
      <stop offset="1" stop-color="#15152e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e2d5"/>
      <stop offset="1" stop-color="#b6a3ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#bac8e0" opacity="0.14"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="1010" cy="170" r="238" fill="#9d8cff" opacity="0.035"/>
    <circle cx="1010" cy="170" r="168" fill="none" stroke="#b6a3ff" stroke-opacity="0.22"/>
    <circle cx="1010" cy="170" r="110" fill="none" stroke="#66e2d5" stroke-opacity="0.3"/>
    <ellipse cx="1010" cy="170" rx="228" ry="74" transform="rotate(-32 1010 170)" fill="none" stroke="url(#accent)" stroke-opacity="0.65" stroke-width="1.5"/>
    <ellipse cx="1010" cy="170" rx="182" ry="60" transform="rotate(38 1010 170)" fill="none" stroke="#b6a3ff" stroke-opacity="0.28"/>
    <circle cx="1010" cy="170" r="6" fill="#e4f5ff"/>
    <circle cx="900" cy="170" r="5" fill="#66e2d5"/>
    <circle cx="1133" cy="56" r="6" fill="#b6a3ff"/>
    <path d="M 1000 170 h 20 M 1010 160 v 20" stroke="#e4f5ff" stroke-opacity="0.4"/>
    <rect x="64" y="65" width="40" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="112" fill="#99b1d0" font-family="DejaVu Sans, sans-serif" font-size="13" letter-spacing="3.5">DAEHAN-YOON / GITHUB</text>
    <text x="60" y="191" fill="#f3f6ff" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Daehan Yoon</text>
    <text x="64" y="235" fill="#b9c9e2" font-family="DejaVu Sans, sans-serif" font-size="22">Pusan National University</text>
    <rect x="64" y="279" width="360" height="1" fill="url(#accent)" opacity="0.6"/>
  </g>
</svg>
